name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test suite (no network, no service, no third-party packages)
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/test_formulate.py

      # The point of the project: a replay of the 0.1.2 defect must report that
      # formulation as unusable and must say so in the exit code. Exit 1 is a
      # *finding*, not a failure, so {0,1} is the accepted set.
      #
      # The JSON assertions run in Python rather than through `grep -q`. `grep -q`
      # exits 1 when it finds nothing, and a `run:` block executes under `set -e`,
      # so a check that reports a problem and a check that is broken produce the
      # same red step with no way to tell them apart. `tools/check_replay_json.py`
      # names what it looked for.
      # `PYTHONPATH: src` is required, and its absence was a silent CI defect.
      #
      # This project uses a src layout and is not installed in these jobs, so
      # without it `python -m phocinae_formulate` fails with "No module named
      # phocinae_formulate" -- and that exits **1**, which the `code != 1` guard
      # below reads as "a finding was reported". The step then died on the next
      # line with an empty replay.json, naming neither the missing module nor the
      # missing path. The unit tests never showed this because the test script
      # sets PYTHONPATH for itself.
      - name: Replay the 0.1.2 regression anchor
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: src
        run: |
          # Fail loudly if the package is not importable, rather than letting a
          # missing module masquerade as "the defect was reproduced".
          python -c "import phocinae_formulate; print('importable:', phocinae_formulate.__version__)"
          set +e
          python -m phocinae_formulate replay --fixture safety-53 \
            --expect fixtures/replay-0.1.2.expect.json --fixture-path fixtures --json > replay.json
          code=$?
          set -e
          echo "replay exit code: $code (1 = a finding was reported)"
          if [ "$code" != "1" ]; then
            echo "expected exit 1 (finding), got $code"
            exit 1
          fi
          python tools/check_replay_json.py replay.json

      - name: Doctor on the shipped gold set
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: src
        run: python -m phocinae_formulate doctor --gold fixtures/safety-53.gold.jsonl

      - name: Build a wheel and inspect it
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist-upload
          python tools/verify_wheel_contents.py dist-upload

      - name: The working tree must be clean after the suite
        shell: bash
        run: |
          if [ -d .git ]; then
            dirty=$(git status --porcelain | wc -l)
            echo "dirty entries: $dirty"
            git status --porcelain
            test "$dirty" -eq 0
          else
            echo "not a git checkout; skipping"
          fi
