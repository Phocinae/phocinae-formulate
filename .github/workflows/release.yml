name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test suite
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/test_formulate.py

      # `PYTHONPATH: src` is required: this project uses a src layout and is not
      # installed in this job. Without it `python -m phocinae_formulate` fails
      # with "No module named phocinae_formulate", and that exits **1** -- the
      # same code as "a finding was reported", so the guard below accepted an
      # import failure as a successful reproduction and the step died later on an
      # empty replay.json.
      #
      # The import is asserted first so a missing module can never again be
      # mistaken for "the defect was reproduced".
      - name: Replay the 0.1.2 regression anchor
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: src
        run: |
          python -c "import phocinae_formulate; print('importable:', phocinae_formulate.__version__)"
          set +e
          python -m phocinae_formulate replay --fixture safety-53 \
            --expect fixtures/replay-0.1.2.expect.json --fixture-path fixtures --json > replay.json
          code=$?
          set -e
          echo "replay exit code: $code (1 = a finding was reported)"
          if [ "$code" != "1" ]; then
            echo "expected exit 1 (finding), got $code"
            exit 1
          fi
          python tools/check_replay_json.py replay.json

  build:
    name: build and inspect the artefact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist-upload
      - name: Inspect the wheel we are about to upload
        env:
          PYTHONUTF8: "1"
        run: python tools/verify_wheel_contents.py dist-upload
      - name: A fresh install must work
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install --force-reinstall dist-upload/*.whl
          phocinae-formulate --version
          phocinae-formulate doctor --gold "$(python -c "import phocinae_formulate, os; print(os.path.join(os.path.dirname(phocinae_formulate.__file__), 'fixtures', 'safety-53.gold.jsonl'))")"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist-upload/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phocinae-formulate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist-upload

      # Trusted publishing (OIDC): no token is stored in this repository.
      #
      # PyPI binds a publisher to owner + repository + WORKFLOW FILENAME +
      # environment, so this file must be named `release.yml` for the publisher
      # configured for this project to match. Renaming it silently breaks
      # publishing, and the error names a filename mismatch only after a failed
      # release. `skip-existing` makes the job idempotent on a version that is
      # already on PyPI, so a re-run of this workflow is a safe way to test the
      # publisher binding without spending a version number.
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-upload
          skip-existing: true

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist-upload
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --generate-notes dist-upload/*
          fi
